name: Suggest a feature
description: Something you'd like Portage to do
labels: [request]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do
      placeholder: Pick up a film on my Mac where I left it on my iPhone.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options: [iPhone, iPad, Mac]
