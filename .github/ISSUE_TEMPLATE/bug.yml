name: Report a problem
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: The film stops after a minute when I cast it to my Chromecast.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a film from my Jellyfin server
        2. Cast to the living room Chromecast
        3. Wait a minute
  - type: textarea
    id: setup
    attributes:
      label: Setup
      placeholder: |
        Portage 1.0.12 (41) on iPhone, iOS 26.1
        Sources: Jellyfin, Network share (SMB)
        Remote access: Tailscale
  - type: markdown
    attributes:
      value: Issues are public. Leave out server addresses, account names and tokens.
